
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบค้นหาอะไหล่</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    color: #1e293b;
}

header {
    background: #12345a;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0 0 8px;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #00000010;
}

.search {
    width: 100%;
    padding: 15px;
    border: 2px solid #1769aa;
    border-radius: 8px;
    font-size: 17px;
}

.parts-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.part-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 3px 12px #00000010;
}

.part-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #f8fafc;
    border-radius: 8px;
}

.code {
    color: #1769aa;
    font-weight: bold;
}

#resultCount {
    color: #1769aa;
    font-weight: bold;
}

.no-result {
    text-align: center;
    color: #dc2626;
    padding: 30px;
    grid-column: 1 / -1;
}

.clear-btn {
    margin-top: 12px;
    background: #64748b;
}

button {
    background: #1769aa;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 7px;
    cursor: pointer;
    width: 100%;
    font-size: 15px;
}

button:hover {
    background: #0c477b;
}

</style>
</head>

<body>

<header>
    <h1>ค้นหาอะไหล่พลวัชร์ เครื่องยนต์</h1>
    <p>SPARE PARTS POLAWAT ENGINE CO.,LTD</p>
</header>

<div class="container">

    <!-- ช่องค้นหา -->
    <section class="panel">

        <h2>🔍 ค้นหาอะไหล่</h2>

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="ค้นหาด้วยชื่ออะไหล่ หรือ รหัสอะไหล่..."
            oninput="searchParts()"
        >

        <p id="resultCount"></p>

        <button class="clear-btn" onclick="clearSearch()">
            ล้างข้อมูลค้นหา
        </button>

    </section>

    <!-- รายการอะไหล่ -->
    <section class="panel">

        <h2>📦 รายการอะไหล่ทั้งหมด</h2>

        <div id="partsList" class="parts-grid"></div>

    </section>

</div>

<script>

// ข้อมูลอะไหล่
let parts = [

    {
        code: "SP001",
        name: "ไส้กรองน้ำมันเครื่อง",
        image: "https://placehold.co/400x250?text=Oil+Filter"
    },

    {
        code: "SP002",
        name: "หัวเทียน",
        image: "https://placehold.co/400x250?text=Spark+Plug"
    },

    {
        code: "SP003",
        name: "ผ้าเบรก",
        image: "https://placehold.co/400x250?text=Brake+Pad"
    },

    {
        code: "SP004",
        name: "กรองอากาศ",
        image: "https://placehold.co/400x250?text=Air+Filter"
    },

    {
        code: "SP005",
        name: "สายพานเครื่องยนต์",
        image: "https://placehold.co/400x250?text=Engine+Belt"
    }

];

// แสดงรายการอะไหล่
function displayParts(data) {

    const list = document.getElementById("partsList");

    document.getElementById("resultCount").textContent =
        "พบอะไหล่ " + data.length + " รายการ";

    list.innerHTML = "";

    // กรณีไม่พบข้อมูล
    if (data.length === 0) {

        list.innerHTML = `
            <div class="no-result">
                <h3>ไม่พบข้อมูลอะไหล่</h3>
                <p>กรุณาตรวจสอบชื่อหรือรหัสอะไหล่อีกครั้ง</p>
            </div>
        `;

        return;
    }

    // แสดงการ์ดอะไหล่
    data.forEach(part => {

        const card = document.createElement("div");

        card.className = "part-card";

        const img = document.createElement("img");
        img.src = part.image;
        img.alt = part.name;
        img.onerror = function() {
            this.src = "https://placehold.co/400x250?text=No+Image";
        };

        const name = document.createElement("h3");
        name.textContent = part.name;

        const code = document.createElement("p");
        code.innerHTML = "รหัสอะไหล่: ";

        const codeText = document.createElement("span");
        codeText.className = "code";
        codeText.textContent = part.code;

        code.appendChild(codeText);

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(code);

        list.appendChild(card);

    });

}

// ฟังก์ชันค้นหาอะไหล่
function searchParts() {

    const keyword = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    // ค้นหาจากชื่อและรหัส
    const filteredParts = parts.filter(part => {

        const name = part.name.toLowerCase();
        const code = part.code.toLowerCase();

        return name.includes(keyword) ||
               code.includes(keyword);

    });

    // แสดงผลการค้นหา
    displayParts(filteredParts);

}

// ล้างช่องค้นหา
function clearSearch() {

    document.getElementById("searchInput").value = "";

    displayParts(parts);

}

// เริ่มต้นระบบ
displayParts(parts);

</script>

</body>
</html>
